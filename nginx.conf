# Тот же приём, что у Vite в dev: фронт и API на одном origin, поэтому CORS не нужен.
#
# Шаблон: ${PORT}, ${BACKEND_URL} и ${NGINX_LOCAL_RESOLVERS} подставляет образ nginx при старте.
# BACKEND_URL — полный адрес бэкенда: http://app:8081 в docker-compose,
# https://gapu-chap-dv58.onrender.com на Render.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;

    # Адрес бэкенда в переменной: nginx резолвит его при запросе, а не при старте.
    # Иначе он не запустится, пока бэкенд недоступен, и навсегда запомнит IP за Cloudflare.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $backend ${BACKEND_URL};

    # Host — адрес самого бэкенда: по нему Render маршрутизирует запрос.
    # SNI нужен для HTTPS-бэкенда.
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Файлы с хешем в имени (assets/index-AbC123.js) неизменны — кешируем «навсегда».
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $backend;
    }

    location = /health {
        proxy_pass $backend;
    }

    # WebSocket: апгрейд соединения и длинные таймауты (по умолчанию nginx рвёт простой через 60 с;
    # сервер шлёт ping каждые 30 с, так что соединение не простаивает).
    # Origin убираем: бэкенд сверяет его с Host, а Host теперь адрес бэкенда, не фронта.
    # Без Origin проверка пропускается. Защита от чужих сайтов не теряется: вход по Bearer-токену,
    # а не по cookie, — у чужой страницы токена нет.
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA: любые другие пути (/rooms/12) отдаёт index.html, дальше маршрутизирует React Router.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
