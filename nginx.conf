# Тот же приём, что у Vite в dev: фронт и API на одном origin, поэтому CORS не нужен.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Файлы с хешем в имени (assets/index-AbC123.js) неизменны — кешируем «навсегда».
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://app:8081;
    }

    # WebSocket: апгрейд соединения и длинные таймауты (по умолчанию nginx рвёт простой через 60 с;
    # сервер шлёт ping каждые 30 с, так что соединение не простаивает).
    # Host пробрасываем как есть, вместе с портом ($http_host, а не $host — тот без порта):
    # бэкенд сверяет его с Origin браузера (http://localhost:8080), иначе ответит 403.
    location /ws {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA: любые другие пути (/rooms/12) отдаёт index.html, дальше маршрутизирует React Router.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
